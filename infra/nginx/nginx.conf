events {}

http {
  upstream api { server api:4000; }
  upstream web { server web:3000; }
  upstream admin { server admin:3001; }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location /admin/ {
      proxy_pass http://admin;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
